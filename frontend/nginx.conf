resolver 127.0.0.11 valid=5s ipv6=off;
upstream warehouse_api {
    zone warehouse_api 64k;
    # Also controls retry delay after transient Docker DNS failures on restart.
    resolver_timeout 2s;
    server backend:8080 resolve;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    error_page 502 503 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"success":false,"message":"Service is temporarily unavailable","errors":[{"field":"request","reason":"Please retry shortly"}]}';
    }
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"success":false,"message":"Request body is too large","errors":[{"field":"body","reason":"Maximum body size is 1 MiB"}]}';
    }
    location /api/ { proxy_pass http://warehouse_api; proxy_read_timeout 20s; }
    location /health/ { proxy_pass http://warehouse_api; }
    location /docs { proxy_pass http://warehouse_api; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
